name: HBT 17 Sep Reconstructed L0 Shadow

on:
  push:
    branches:
      - research/hbt-1.4-match-intelligence
    paths:
      - '.github/workflows/hbt-shadow-reconstructed-17sep.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shadow-reconstructed-l0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/hbt-1.4-match-intelligence
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build isolated reconstructed-L0 shadow bridge
        run: |
          set -euo pipefail
          git show 3742f927407114567a93424ac405735bdbc5b7ab:scripts/hbt_frozen_forecast_bridge.mjs > scripts/.hbt_shadow_bridge_tmp.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/.hbt_shadow_bridge_tmp.mjs')
          s=p.read_text()
          start=s.index('    if(!pass){')
          end=s.index('\n\n    const targetLoad=', start)
          s=s[:start]+"    if(!pass){console.warn('HBT SHADOW ONLY: reconstructed runtime failed frozen parity; proceeding prospectively as a challenger, never as frozen control. maxErr=',maxErr);}"+s[end:]
          s=s.replace("const STATUS = path.join(DATA, 'forecast_bridge_status.json');","const STATUS = path.join(DATA, 'hbt_shadow_reconstructed_status.json');")
          s=s.replace("const VERSION = 'HBT-FROZEN-FORECAST-BRIDGE-1.2-EXACT-WEIGHTS';","const VERSION = 'HBT-SHADOW-RECONSTRUCTED-L0-1';")
          s=s.replace("`frozen_control_forecast_${targetDate}.json`","`hbt_shadow_reconstructed_forecast_${targetDate}.json`")
          s=s.replace("schemaVersion:'HBT-FROZEN-CONTROL-FORECAST-1'","schemaVersion:'HBT-SHADOW-RECONSTRUCTED-FORECAST-1'")
          s=s.replace("sourceFile:'persisted HBT-1.1.2 exact frozen-weight runtime'","sourceFile:'reconstructed HBT L0 runtime; prospective shadow challenger only'")
          s=s.replace("sourceLabVersion:'HBT-1.1.2L-R1'","sourceLabVersion:'HBT-SHADOW-RECONSTRUCTED-L0-1'")
          s=s.replace("sourceEngineVersion:'HBT-0.4a frozen L0 exact-weight deployment bridge'","sourceEngineVersion:'HBT reconstructed L0 shadow challenger; frozen parity NOT established'")
          s=s.replace("scope:'Date-scoped forecasts emitted only after exact persisted-weight golden parity.'","scope:'Prospective shadow-only forecasts; known frozen-parity failure retained as diagnostic and never promoted to frozen control.'")
          s=s.replace("goldenParityRequired:true,goldenParityTolerance:PARITY_TOLERANCE","goldenParityRequired:false,goldenParityDiagnosticTolerance:PARITY_TOLERANCE")
          s=s.replace("goldenParityRequired:true,failClosed:true","goldenParityRequired:false,failClosed:false")
          s=s.replace("status:'READY'","status:'SHADOW_READY'")
          p.write_text(s)
          PY

      - name: Run prospective 17 Sep shadow forecast
        run: node scripts/.hbt_shadow_bridge_tmp.mjs --date 2026-09-17

      - name: Freeze derived HDA test markets without bookmaker prices
        run: |
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone
          root=pathlib.Path('hbt_live_data')
          src=root/'hbt_shadow_reconstructed_forecast_2026-09-17.json'
          data=json.load(open(src,encoding='utf-8'))
          captured=datetime.now(timezone.utc)
          rows=[]
          for r in data.get('predictions',[]):
              f=r['fixture']; dt=datetime.fromisoformat(f"{f['date']}T{f.get('time','00:00')}:00+00:00")
              h,d,a=map(float,r['probs'])
              future=dt>captured
              side='H' if h>=a else 'A'; sidep=h if side=='H' else a
              team=f['home'] if side=='H' else f['away']
              dc=(h+d) if side=='H' else (a+d)
              dnb=sidep/(h+a) if h+a else None
              markets=[
                {'family':'1X2','selection':team,'modelProbability':sidep,'fairOdds':1/sidep if sidep else None},
                {'family':'DOUBLE_CHANCE','selection':'1X' if side=='H' else 'X2','modelProbability':dc,'fairOdds':1/dc if dc else None},
                {'family':'DNB','selection':f'{team} DNB','modelProbability':dnb,'fairOdds':1/dnb if dnb else None},
              ]
              rows.append({'fixture':f,'capturedBeforeKickoff':future,'prediction':{'H':h,'D':d,'A':a,'tier':r.get('tier'),'quality':r.get('quality')},'action':'TEST_UNPRICED' if future else 'PASS_POST_KICKOFF','markets':markets if future else [],'origin':'HBT_SHADOW_RECONSTRUCTED','warning':'Known frozen-control parity failure; test-only challenger. Never score as HBT frozen control.'})
          out={
            'schemaVersion':'HBT-SHADOW-RECONSTRUCTED-BETS-1',
            'capturedAt':captured.isoformat().replace('+00:00','Z'),
            'targetDate':'2026-09-17',
            'origin':'HBT_SHADOW_RECONSTRUCTED',
            'state':'FROZEN_PROSPECTIVE_CAPTURE',
            'policy':{
              'frozenControlClaim':False,
              'knownParityFailurePreserved':True,
              'bookmakerOddsUsedAsModelFeature':False,
              'priceRequiredForBET':True,
              'unpricedAction':'TEST_UNPRICED',
              'postKickoffBackfillAllowed':False
            },
            'parityDiagnostic':data.get('bridge',{}).get('goldenMaxAbsError'),
            'fixtures':rows
          }
          json.dump(out,open(root/'hbt_shadow_reconstructed_bets_2026-09-17.json','w',encoding='utf-8'),indent=2)
          print(json.dumps(out,indent=2))
          PY

      - name: Remove temporary executable
        run: rm -f scripts/.hbt_shadow_bridge_tmp.mjs

      - name: Commit immutable shadow capture
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hbt_live_data/hbt_shadow_reconstructed_forecast_2026-09-17.json hbt_live_data/hbt_shadow_reconstructed_status.json hbt_live_data/hbt_shadow_reconstructed_bets_2026-09-17.json
          git diff --staged --quiet && exit 0
          git commit -m 'test: freeze 17 Sep reconstructed HBT shadow challenger [skip ci]'
          git push origin HEAD:research/hbt-1.4-match-intelligence
