name: HBT Event Market Model Training

on:
  workflow_dispatch:
  push:
    branches:
      - 'research/hbt-1.4-match-intelligence'
    paths:
      - 'scripts/hbt_train_event_models_v4.py'
      - 'scripts/hbt_append_event_live_priors.py'
      - '.github/workflows/hbt-event-model-training.yml'

concurrency:
  group: hbt-event-model-training
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate research changes
        run: |
          python -m py_compile scripts/hbt_train_event_models_v4.py scripts/hbt_append_event_live_priors.py
          python -m unittest discover -s tests
      - name: Train candidate parameters only on explicit dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/hbt_train_event_models_v4.py
          python scripts/hbt_append_event_live_priors.py
      - name: Preserve candidate for review
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hbt-event-model-candidate
          path: hbt_live_data/event_model_params.json
          if-no-files-found: error
