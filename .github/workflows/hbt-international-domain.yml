name: HBT International Domain Challenger

on:
  push:
    branches:
      - research/hbt-1.4-match-intelligence
    paths:
      - '.github/workflows/hbt-international-domain.yml'
      - 'scripts/hbt_international_challenger_v1.py'
      - 'scripts/hbt_international_context_v2.py'
      - 'scripts/hbt_international_intelligence_v3.py'
      - 'scripts/hbt_international_forensic_v1.py'
      - 'scripts/hbt_scan_slate_v2.py'
      - 'scripts/hbt_scan_slate_v2_1.py'
      - 'scripts/hbt_scan_slate_v2_2.py'
      - 'docs/HBT-1.4-INTERNATIONAL-DOMAIN-SPEC.md'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD prospective international slate date'
        required: true
        type: string
  schedule:
    - cron: '50 8 * * *'

permissions:
  contents: write

concurrency:
  group: hbt-international-domain
  cancel-in-progress: false

jobs:
  international-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/hbt-1.4-match-intelligence
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET='${{ inputs.date }}'
          else
            TARGET="$(date -u +%F)"
          fi
          echo "date=$TARGET" >> "$GITHUB_OUTPUT"
          echo "International target: $TARGET"

      - name: Compile research adapter
        run: |
          set -euo pipefail
          python -m py_compile scripts/hbt_scan_slate_v2.py scripts/hbt_scan_slate_v2_1.py scripts/hbt_scan_slate_v2_2.py scripts/hbt_international_challenger_v1.py scripts/hbt_international_context_v2.py scripts/hbt_international_intelligence_v3.py scripts/hbt_international_forensic_v1.py

      - name: Settle prior immutable international evidence and rebuild registry
        run: |
          set -euo pipefail
          python scripts/hbt_international_forensic_v1.py --date '${{ steps.target.outputs.date }}'

      - name: Guard forensic learning contract
        env:
          TARGET_DATE: '${{ steps.target.outputs.date }}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('hbt_live_data/international')
          s=json.load(open(root/'hbt_international_forensic_settlement.json',encoding='utf-8'))
          r=json.load(open(root/'hbt_international_evidence_registry.json',encoding='utf-8'))
          a=json.load(open(root/'hbt_international_learning_assessment.json',encoding='utf-8'))
          assert s['policy']['retrospectivePredictionsFabricated'] is False
          assert s['policy']['identityTimingBlockedExcludedFromLearning'] is True
          assert s['policy']['bookmakerOddsRead'] is False
          assert s['policy']['modelRetuned'] is False
          assert r['policy']['cleanProspectiveOnlyForPredictiveLearning'] is True
          assert r['policy']['legacyEvidenceHypothesisOnly'] is True
          assert a['retuningPerformed'] is False
          assert a['promotionAllowed'] is False
          for row in r.get('records') or []:
              if row.get('learningEligible'):
                  assert row.get('evidenceClass') == 'CLEAN_PROSPECTIVE'
                  assert row.get('identityVerified') is True
                  assert not row.get('exclusionReasons')
          print(json.dumps({'settlement':s['summary'],'assessment':a},indent=2))
          PY

      - name: Discover public slate without changing frozen model
        run: |
          set -euo pipefail
          python scripts/hbt_scan_slate_v2_2.py --date '${{ steps.target.outputs.date }}'

      - name: Build causal international challenger and chronological validation
        run: |
          set -euo pipefail
          python scripts/hbt_international_challenger_v1.py --date '${{ steps.target.outputs.date }}'

      - name: Build timing-safe venue-aware prospective card and probe official XI
        run: |
          set -euo pipefail
          python scripts/hbt_international_context_v2.py --date '${{ steps.target.outputs.date }}'

      - name: Test causal recent-performance interaction on untouched holdout
        run: |
          set -euo pipefail
          python scripts/hbt_international_intelligence_v3.py --date '${{ steps.target.outputs.date }}'

      - name: Guard research-only contract
        env:
          TARGET_DATE: '${{ steps.target.outputs.date }}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          d=os.environ['TARGET_DATE']
          p=pathlib.Path(f'hbt_live_data/international/hbt_international_challenger_{d}.json')
          x=json.load(open(p,encoding='utf-8'))
          q=x['policy']; v=x['validation']
          assert x['targetDate']==d
          assert q['researchOnly'] is True
          assert q['frozenHBT112Mutated'] is False
          assert q['domesticForecastsMutated'] is False
          assert q['bookmakerOddsRead'] is False
          assert q['pointInTimeCausality'] is True
          assert q['missingIsZero'] is False
          assert q['automaticPromotion'] is False
          assert q['automaticFunding'] is False
          assert v['promotionAllowed'] is False
          assert x['historySource']['commit']=='394fe81893b062fbc2cf6257e988ac7cc4c039a1'
          assert v['selection']['n'] > 0
          assert v['holdout']['n'] > 0
          for r in x.get('internationalCandidates') or []:
              assert (r.get('execution') or {}).get('fundingAllowed') is False
              assert (r.get('execution') or {}).get('class')=='R0_SHADOW_RESEARCH'

          pp=pathlib.Path(f'hbt_live_data/international/hbt_international_prospective_{d}.json')
          y=json.load(open(pp,encoding='utf-8'))
          qp=y['policy']
          assert qp['researchOnly'] is True
          assert qp['postKickoffRowsExcludedFromProspectiveEvidence'] is True
          assert qp['venueContextMustBeVerifiedForCleanProspectiveEvidence'] is True
          assert qp['thirdCountryVenueRemovesNominalHomeAdvantage'] is True
          assert qp['automaticPromotion'] is False and qp['automaticFunding'] is False
          for r in y.get('prospectiveCandidates') or []:
              assert (r.get('capture') or {}).get('statusAtCapture')=='PRE_KICKOFF'
              assert (r.get('execution') or {}).get('fundingAllowed') is False
              vc=r.get('venueContext') or {}
              if vc.get('status') in {'VERIFIED_THIRD_COUNTRY_NEUTRAL_OR_DISPLACED','VERIFIED_AWAY_COUNTRY_OR_DISPLACED_HOME','VERIFIED_NEUTRAL'}:
                  assert vc.get('homeAdvantageApplied') is False
          for r in y.get('postKickoffResearchRows') or []:
              assert r not in (y.get('prospectiveCandidates') or [])

          ip=pathlib.Path(f'hbt_live_data/international/hbt_international_intelligence_{d}.json')
          z=json.load(open(ip,encoding='utf-8')); qz=z['policy']; vz=z['validation']
          assert qz['researchOnly'] is True
          assert qz['frozenHBT112Mutated'] is False and qz['domesticForecastsMutated'] is False
          assert qz['bookmakerOddsRead'] is False
          assert qz['missingIsZero'] is False and qz['missingContributionNeutral'] is True
          assert qz['automaticPromotion'] is False and qz['automaticFunding'] is False
          assert vz['selection']['n'] > 0 and vz['holdout']['n'] > 0
          assert vz['promotionAllowed'] is False
          for r in z.get('prospectiveCandidates') or []:
              assert (r.get('execution') or {}).get('fundingAllowed') is False
          print(json.dumps({'v1':x['summary'],'domainSummary':x['domainSummary'],'structuralValidation':v,'v2':y['summary'],'v3':z['summary'],'recentValidation':vz},indent=2))
          PY

      - name: Keep generic scanner output out of international commit
        run: git checkout -- hbt_live_data/slate_scanner.json || true

      - name: Commit international research evidence
        run: |
          set -euo pipefail
          D='${{ steps.target.outputs.date }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hbt_live_data/international/
          git diff --staged --quiet && exit 0
          git commit -m "research: HBT international domain challenger ${D} [skip ci]"
          git fetch origin research/hbt-1.4-match-intelligence
          git rebase origin/research/hbt-1.4-match-intelligence
          git push origin HEAD:research/hbt-1.4-match-intelligence
