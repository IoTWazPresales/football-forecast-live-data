name: HBT Live Intelligence Feed

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/hbt_collect_live_data.py'
      - 'scripts/hbt_collect_players_espn.py'
      - 'scripts/hbt_collect_prexi_context.py'
      - 'scripts/hbt_collect_prexi_context_v2.py'
      - 'scripts/hbt_collect_context_v3.py'
      - 'scripts/hbt_collect_context_v3_runtime.py'
      - 'scripts/hbt_collect_market_intelligence_v4.py'
      - 'scripts/hbt_collect_market_intelligence_v4_runtime.py'
      - 'scripts/hbt_collect_market_intelligence_v4_runtime_xhr.py'
      - 'hbt_live_data/event_model_params.json'
      - 'hbt_live_data/player_prop_model_params.json'
      - '.github/workflows/hbt-live-data.yml'

concurrency:
  group: hbt-live-intelligence-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect normalized HBT performance intelligence
        run: python scripts/hbt_collect_live_data.py
      - name: Replace blocked SofaScore player feed with ESPN fallback
        run: python scripts/hbt_collect_players_espn.py
      - name: Collect hardened R3 context shadow intelligence
        run: python scripts/hbt_collect_context_v3_runtime.py
      - name: Collect XHR-hardened HBT-1.3 market/tactical intelligence
        run: python scripts/hbt_collect_market_intelligence_v4_runtime_xhr.py
      - name: Validate generated feed
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('hbt_live_data')
          m=json.load(open(root/'manifest.json',encoding='utf-8'))
          p=json.load(open(root/'performance.json',encoding='utf-8'))
          x=json.load(open(root/'player_features.json',encoding='utf-8'))
          s=json.load(open(root/'pre_xi_context.json',encoding='utf-8'))
          q=json.load(open(root/'market_intelligence.json',encoding='utf-8'))
          assert m['schemaVersion']=='HBT-LIVE-DATA-1'
          assert p['schemaVersion']==m['schemaVersion']==x['schemaVersion']==s['schemaVersion']==q['schemaVersion']
          assert s.get('policy',{}).get('feedsBackIntoPrediction') is False and s.get('policy',{}).get('oddsUsed') is False
          assert s.get('researchVersion') == 'HBT-1.2R-R3-CONTEXT'
          assert m.get('contextResearchVersion') == 'HBT-1.2R-R3-CONTEXT'
          assert q.get('researchVersion') == 'HBT-1.3R-MARKET-INTEL'
          assert q.get('policy',{}).get('feedsFrozenPrediction') is False and q.get('policy',{}).get('oddsUsed') is False
          assert m.get('files',{}).get('preXiContext') == 'pre_xi_context.json'
          assert m.get('files',{}).get('marketIntelligence') == 'market_intelligence.json'
          assert isinstance(q.get('health'),dict)
          need={'en.1','es.1','de.1','it.1','fr.1'};have=set(p.get('leagues',{}));assert len(need & have)>=4,(need,have)
          for code,pack in p.get('leagues',{}).items(): assert isinstance(pack.get('teams'),list)
          for row in (s.get('fixtures') or {}).values():
              assert row.get('predictionPolicy','').startswith('SHADOW ONLY')
              assert 'availabilitySourceKnown' in row and 'lineupHistoryReady' in row and 'weightedAvailabilityReady' in row
              assert 'extendedContext' in row and 'intelligenceReadiness' in row
          for row in (q.get('fixtures') or {}).values():
              assert set((row.get('readiness') or {})) >= {'playerProps','corners','cards','formation','travel'}
              assert 'eventMarkets' in row and row.get('policy',{}).get('bookmakerOddsUsed') is False
          print('Feed validation passed',m['generatedAt'],'R3',len(s.get('fixtures',{})),'HBT13',len(q.get('fixtures',{})),'health',q.get('health'))
          PY
      - name: Commit feed if changed
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TMP="$(mktemp -d)"
          cp -a hbt_live_data/. "$TMP/"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p hbt_live_data
          rm -rf hbt_live_data/*
          cp -a "$TMP/." hbt_live_data/
          git add hbt_live_data
          git diff --staged --quiet && exit 0
          git commit -m 'data: refresh HBT live intelligence [skip ci]'
          git push origin "HEAD:$BRANCH"
