name: HBT-1.4 Research Live Intelligence

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hbt-1-4-live-research.yml'

concurrency:
  group: hbt-1-4-research-live-intelligence
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-research-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/hbt-1.4-match-intelligence
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile HBT-1.4 live collector
        run: python -m py_compile scripts/hbt_collect_match_intelligence_v5.py
      - name: Collect HBT-1.4 live match intelligence
        run: python scripts/hbt_collect_match_intelligence_v5.py
      - name: Validate readiness contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('hbt_live_data/hbt_1_4_match_intelligence.json',encoding='utf-8'))
          assert p.get('version')=='HBT-1.4R-MATCH-INTELLIGENCE-LIVE', p.get('version')
          rows=p.get('fixtures') or {}
          assert isinstance(rows,dict)
          for row in rows.values():
              state=row.get('readinessState') or row.get('readiness') or row.get('state')
              if state is not None:
                  assert state in {'PRE_XI_PROVISIONAL','CONFIRMED_XI_READY'}, state
          print('HBT-1.4 live readiness validation passed',p.get('generatedAt'),len(rows))
          PY
      - name: Commit HBT-1.4 research feed if changed
        run: |
          set -euo pipefail
          BRANCH='research/hbt-1.4-match-intelligence'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TMP="$(mktemp -d)"
          cp hbt_live_data/hbt_1_4_match_intelligence.json "$TMP/"
          if [ -f hbt_live_data/_hbt_1_4_live_cache.json ]; then cp hbt_live_data/_hbt_1_4_live_cache.json "$TMP/"; fi
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          cp "$TMP/hbt_1_4_match_intelligence.json" hbt_live_data/
          if [ -f "$TMP/_hbt_1_4_live_cache.json" ]; then cp "$TMP/_hbt_1_4_live_cache.json" hbt_live_data/; fi
          git add hbt_live_data/hbt_1_4_match_intelligence.json
          if [ -f hbt_live_data/_hbt_1_4_live_cache.json ]; then git add hbt_live_data/_hbt_1_4_live_cache.json; fi
          git diff --staged --quiet && exit 0
          git commit -m 'data: refresh HBT-1.4 research live intelligence [skip ci]'
          git push origin "HEAD:$BRANCH"
