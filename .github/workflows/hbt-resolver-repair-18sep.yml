name: HBT 18 Sep Resolver Repair

on:
  push:
    branches:
      - research/hbt-1.4-match-intelligence
    paths:
      - '.github/workflows/hbt-resolver-repair-18sep.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolver-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/hbt-1.4-match-intelligence
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh 18 Sep discovery
        run: |
          set -euo pipefail
          python scripts/hbt_scan_slate_v2_1.py --date 2026-09-18
          python - <<'PY'
          import json
          s=json.load(open('hbt_live_data/slate_scanner.json',encoding='utf-8'))
          assert s.get('targetDate')=='2026-09-18'
          assert int((s.get('coverage') or {}).get('fixturesDiscovered') or 0)>0
          print(json.dumps({'generatedAt':s.get('generatedAt'),'coverage':s.get('coverage')},indent=2))
          PY

      - name: Build gender-safe broad resolver with C1 transfer
        run: |
          set -euo pipefail
          git show 3742f927407114567a93424ac405735bdbc5b7ab:scripts/hbt_frozen_forecast_bridge.mjs > scripts/.hbt_resolver_v3_tmp.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/.hbt_resolver_v3_tmp.mjs')
          s=p.read_text()

          # Preserve the known frozen-parity failure as a diagnostic only. This remains an isolated shadow challenger.
          start=s.index('    if(!pass){')
          end=s.index('\n\n    const targetLoad=', start)
          s=s[:start]+"    if(!pass){console.warn('HBT RESOLVER V3 SHADOW ONLY: known frozen parity failure preserved; proceeding as isolated prospective challenger. maxErr=',maxErr);}"+s[end:]

          s=s.replace("const STATUS = path.join(DATA, 'forecast_bridge_status.json');","const STATUS = path.join(DATA, 'hbt_broad_shadow_status_2026-09-18_resolver_v3.json');")
          s=s.replace("const VERSION = 'HBT-FROZEN-FORECAST-BRIDGE-1.2-EXACT-WEIGHTS';","const VERSION = 'HBT-BROAD-SHADOW-18SEP-RESOLVER-V3';")
          s=s.replace("`frozen_control_forecast_${targetDate}.json`","`hbt_broad_shadow_forecast_${targetDate}_resolver_v3.json`")
          s=s.replace("schemaVersion:'HBT-FROZEN-CONTROL-FORECAST-1'","schemaVersion:'HBT-BROAD-SHADOW-FORECAST-RESOLVER-V3'")
          s=s.replace("sourceFile:'persisted HBT-1.1.2 exact frozen-weight runtime'","sourceFile:'reconstructed HBT L0 broad-slate resolver-v3 shadow test'")
          s=s.replace("sourceLabVersion:'HBT-1.1.2L-R1'","sourceLabVersion:'HBT-BROAD-SHADOW-18SEP-RESOLVER-V3'")
          s=s.replace("sourceEngineVersion:'HBT-0.4a frozen L0 exact-weight deployment bridge'","sourceEngineVersion:'HBT reconstructed L0 + historical C1 transfer; gender-safe resolver'")
          s=s.replace("scope:'Date-scoped forecasts emitted only after exact persisted-weight golden parity.'","scope:'Prospective resolver-repair shadow test. Men/women/youth namespaces are separated; C1 transfer reuses frozen L0 structural weights and is capped below A tier.'")
          s=s.replace("goldenParityRequired:true,goldenParityTolerance:PARITY_TOLERANCE","goldenParityRequired:false,goldenParityDiagnosticTolerance:PARITY_TOLERANCE")
          s=s.replace("goldenParityRequired:true,failClosed:true","goldenParityRequired:false,failClosed:false")
          s=s.replace("status:'READY'","status:'SHADOW_READY'")

          old_fixture="function fixtureLeague(row,hbtLeagueIndex){const date=String(row.kickoff||row.date||'').slice(0,10),k=fixtureKey(date,row.home,row.away),fromIntel=hbtLeagueIndex.get(k);if(fromIntel)return fromIntel;if(row.leagueHint)return String(row.leagueHint);const s=normText(row.competition||row.competitionSlug||'');for(const [code,labels] of LEAGUE_LABELS)if(labels.some(x=>s===normText(x)||s.includes(normText(x))))return code;return null;}\nfunction stateResolve(states,name){const direct=teamKey(name);if(states.has(direct))return direct;const b=baseTeamKey(name);if(states.has(b))return b;return null;}"
          new_fixture=r'''const C1_CODES=new Set(['en.2','es.2','it.2','be.1','pl.1','ie.1']);
const EXTRA_LEAGUE_LABELS=[
  ['en.2',['english league championship','english championship','championship']],
  ['es.2',['spanish laliga 2','laliga 2','segunda division','segunda división']],
  ['it.2',['italian serie b','serie b']],
  ['be.1',['belgian pro league','belgian first division a','first division a']],
  ['pl.1',['polish ekstraklasa','ekstraklasa']],
  ['ie.1',['league of ireland premier division','irish premier division']]
];
const IDENTITY_STOP=new Set(['fc','cf','afc','ssc','ac','fk','sk','sv','sc','rc','rcd','cd','ud','us','as','club','clube','football','futbol','fussball','calcio','societa','sportiva','racing','de','do','del','the']);
function identitySignature(name){
  let x=baseTeamKey(name).replace(/\bmunich\b/g,'munchen').replace(/\bmuenchen\b/g,'munchen').replace(/\bcologne\b/g,'koln');
  return x.split(' ').filter(t=>t&&!IDENTITY_STOP.has(t)).join(' ');
}
function blockedIdentityNamespace(row){
  const s=normText(`${row.competition||''} ${row.competitionSlug||''}`);
  if(/(^| )(women|womens|female|feminine|femenina|feminino|frauen)( |$)/.test(s))return 'WOMEN';
  if(s.includes('spanish liga f')||s.includes('liga femenina'))return 'WOMEN';
  if(/(^| )(u17|u18|u19|u20|u21|u23|youth|reserve|reserves)( |$)/.test(s))return 'YOUTH_OR_RESERVE';
  return null;
}
function fixtureLeague(row,hbtLeagueIndex){
  const date=String(row.kickoff||row.date||'').slice(0,10),k=fixtureKey(date,row.home,row.away),fromIntel=hbtLeagueIndex.get(k);if(fromIntel)return fromIntel;
  if(row.leagueHint)return String(row.leagueHint);
  const txt=normText(row.competition||row.competitionSlug||'');
  for(const [code,labels] of [...LEAGUE_LABELS,...EXTRA_LEAGUE_LABELS])if(labels.some(x=>txt===normText(x)||txt.includes(normText(x))))return code;
  return null;
}
function stateResolve(states,name){
  const b=baseTeamKey(name);if(states.has(b))return b;
  const direct=teamKey(name);if(states.has(direct))return direct;
  const sig=identitySignature(name);if(!sig)return null;
  const exact=[],partial=[];
  for(const [k,st] of states){
    const ss=identitySignature(st?.display||k);if(!ss)continue;
    if(ss===sig)exact.push(k);
    else if(sig.length>=5&&ss.length>=5&&(ss===sig||ss.endsWith(' '+sig)||sig.endsWith(' '+ss)||ss.includes(sig)||sig.includes(ss)))partial.push(k);
  }
  if(exact.length===1)return exact[0];
  const u=[...new Set(partial)];if(u.length===1)return u[0];
  return null;
}
function c1CsvLine(line){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out;}
function c1Date(v){if(!v)return null;const z=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(z))return z.slice(0,10);const m=z.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;}return null;}
async function fetchTextURL(url){const r=await fetch(url,{headers:{'user-agent':UA,'accept':'text/csv,*/*'}});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return await r.text();}
async function c1CurrentExtras(code,targetDate){
  const out=[];const year=+targetDate.slice(0,4),start=code==='ie.1'?`${year}-01-01`:`${year}-07-01`,endDate=new Date(targetDate+'T00:00:00Z');endDate.setUTCDate(endDate.getUTCDate()-1);const end=endDate.toISOString().slice(0,10);
  const ESPN={'en.2':'eng.2','es.2':'esp.2','it.2':'ita.2','be.1':'bel.1','ie.1':'irl.1','pl.1':'pol.1'};
  if(ESPN[code]){try{const j=await fetchJSON(`https://site.api.espn.com/apis/site/v2/sports/soccer/${ESPN[code]}/scoreboard?dates=${start.replace(/-/g,'')}-${end.replace(/-/g,'')}&limit=1000`);for(const ev of j?.events||[]){const comp=ev.competitions?.[0],cs=comp?.competitors||[],h=cs.find(x=>x.homeAway==='home'),a=cs.find(x=>x.homeAway==='away');if(!h||!a)continue;const completed=!!(ev.status?.type?.completed||comp?.status?.type?.completed),d=String(ev.date||comp?.date||'').slice(0,10),hg=Number(h.score?.value??h.score),ag=Number(a.score?.value??a.score);if(!completed||!d||d>=targetDate||!Number.isFinite(hg)||!Number.isFinite(ag))continue;out.push({date:d,time:String(ev.date||'').slice(11,16),home:h.team?.displayName||h.team?.shortDisplayName,away:a.team?.displayName||a.team?.shortDisplayName,hg,ag,league:code,season:'2026-27',provider:'ESPN current'});}}catch(e){console.warn('C1 ESPN current failed',code,String(e.message||e));}}
  const FD={pl.1:'POL',ie.1:'IRL'};
  if(FD[code]){try{const txt=await fetchTextURL(`https://www.football-data.co.uk/new/${FD[code]}.csv`),lines=txt.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),head=c1CsvLine(lines.shift()).map(x=>x.trim()),idx=n=>head.indexOf(n);for(const ln of lines){const c=c1CsvLine(ln),d=c1Date(c[idx('Date')]),home=c[idx('HomeTeam')],away=c[idx('AwayTeam')],hg=+c[idx('FTHG')],ag=+c[idx('FTAG')];if(!d||d>=targetDate||!home||!away||!Number.isFinite(hg)||!Number.isFinite(ag))continue;out.push({date:d,time:c[idx('Time')]||'',home,away,hg,ag,league:code,season:'2026-27',provider:'Football-Data current'});}}catch(e){console.warn('C1 Football-Data current failed',code,String(e.message||e));}}
  return out;
}
function c1BuildStatePack(code,results,opts){
  const states=new Map(),leagues=new Map(),use=results.slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));let i=0;
  while(i<use.length){const g=groupKey(use[i]),group=[];while(i<use.length&&groupKey(use[i])===g)group.push(use[i++]);const pending=[];for(const m of group){const hk=baseTeamKey(m.home),ak=baseTeamKey(m.away);if(!states.has(hk))states.set(hk,new TeamState(m.home));if(!states.has(ak))states.set(ak,new TeamState(m.away));const H=states.get(hk),A=states.get(ak);H.league=code;A.league=code;H.everDomestic=A.everDomestic=true;H.lastDomesticSeason=A.lastDomesticSeason=m.season||'2026-27';const snap=snapshot({...m,homeKey:hk,awayKey:ak},states,leagues,opts,true);pending.push({m,H,A,snap});}for(const {m,H,A,snap} of pending){const hp=m.hg>m.ag?3:m.hg===m.ag?1:0,ap=m.ag>m.hg?3:m.hg===m.ag?1:0;H.push({date:m.date,venue:'H',pts:hp,gf:+m.hg,ga:+m.ag,oppElo:snap.awayElo,display:m.home});A.push({date:m.date,venue:'A',pts:ap,gf:+m.ag,ga:+m.hg,oppElo:snap.homeElo,display:m.away});hierarchicalUpdate(H,A,leagues,+m.hg,+m.ag,m.date,opts,snap);}}
  return {states,leagues,resultsN:use.length,teamsN:states.size,newestDate:use.length?use[use.length-1].date:null};
}
async function buildC1Packs(targetDate,opts,model,baseModel,T){
  const packs=new Map(),audit=[];const seasons=['2024-25','2025-26','2026-27'];
  for(const code of C1_CODES){const rows=[],seen=new Set(),sources=[];const add=(r,source)=>{let n=0;for(const m of r||[]){if(!m.date||m.date>=targetDate||!Number.isFinite(+m.hg)||!Number.isFinite(+m.ag))continue;const k=[m.date,baseTeamKey(m.home),baseTeamKey(m.away),+m.hg,+m.ag].join('|');if(seen.has(k))continue;seen.add(k);rows.push({...m,league:code});n++;}sources.push({source,status:'loaded',matches:n});};for(const season of seasons){try{const got=await fetchSeasonCompetition(season,code),r=[];for(const m of got.json?.matches||[]){const ft=scoreFT(m.score),d=String(m.date||'').slice(0,10);if(!ft||ft.length<2||!d||d>=targetDate||ft[0]===null||ft[1]===null)continue;r.push({date:d,time:m.time||'',home:m.team1,away:m.team2,hg:+ft[0],ag:+ft[1],season,provider:got.provider});}add(r,`OpenFootball ${season}`);}catch(e){sources.push({source:`OpenFootball ${season}`,status:'failed',matches:0,error:String(e.message||e)});}}try{add(await c1CurrentExtras(code,targetDate),'current secondary sources');}catch(e){sources.push({source:'current secondary sources',status:'failed',matches:0,error:String(e.message||e)});}rows.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));if(rows.length<8){audit.push({code,status:'failed',results:rows.length,reason:'fewer than 8 completed results',sources});continue;}const st=c1BuildStatePack(code,rows,opts);packs.set(code,{...st,opts,model,baseModel,T});audit.push({code,status:'loaded',results:st.resultsN,teams:st.teamsN,newestDate:st.newestDate,validatedOnLeague:false,A_tier_cap:'B',sources});}
  return {packs,audit};
}'''
          if old_fixture not in s:
              raise SystemExit('identity resolver patch anchor not found')
          s=s.replace(old_fixture,new_fixture)

          old_target="const targetLoad=targetDate===PARITY_AS_OF_EXCLUSIVE?parityLoad:await loadSources(seasons,codes,targetDate),targetState=buildState(targetLoad.matches,{...lock.opts}),deploy={...targetState,opts:{...lock.opts},model,baseModel,T};\n    const intelLeague=new Map();"
          new_target="const targetLoad=targetDate===PARITY_AS_OF_EXCLUSIVE?parityLoad:await loadSources(seasons,codes,targetDate),targetState=buildState(targetLoad.matches,{...lock.opts}),deploy={...targetState,opts:{...lock.opts},model,baseModel,T};\n    const c1Built=await buildC1Packs(targetDate,{...lock.opts},model,baseModel,T),c1Packs=c1Built.packs,c1Audit=c1Built.audit;\n    const intelLeague=new Map();"
          if old_target not in s:
              raise SystemExit('C1 target patch anchor not found')
          s=s.replace(old_target,new_target)

          loop_start=s.index('    const predictions=[],excluded=[];')
          loop_end=s.index('\n    const artifact=',loop_start)
          new_loop=r'''    const predictions=[],excluded=[];
    for(const r of scanner.fixtures||[]){
      const date=String(r.kickoff||'').slice(0,10);if(date!==targetDate)continue;
      const blocked=blockedIdentityNamespace(r);if(blocked){excluded.push({fixture:`${r.home} vs ${r.away}`,league:null,reason:`identity namespace blocked: ${blocked}`,competition:r.competition||r.competitionSlug||null});continue;}
      const league=fixtureLeague(r,intelLeague),isC1=!!(league&&C1_CODES.has(league)),useDeploy=isC1?c1Packs.get(league):deploy;
      if(isC1&&!useDeploy){excluded.push({fixture:`${r.home} vs ${r.away}`,league,reason:'C1 state pack unavailable',competition:r.competition||r.competitionSlug||null});continue;}
      const fx={date,time:String(r.kickoff||'').slice(11,16),league:league||'UNMAPPED',home:r.home,away:r.away,sourceStatus:(r.sourceFreshness?'loaded':'unknown')},p=predictFixture(fx,useDeploy,isC1?0:targetState.crossLeagueLinks);
      if(!p.ok){excluded.push({fixture:`${r.home} vs ${r.away}`,league:league||null,reason:p.reason,competition:r.competition||r.competitionSlug||null});continue;}
      const rawTier=p.tier,tier=isC1&&rawTier==='A'?'B':rawTier,coverage=isC1?`C1 transfer · ${p.maxAge>75?'stale-ish '+Math.round(p.maxAge)+'d':'state '+useDeploy.resultsN+' matches'}`:(p.maxAge>75?`stale-ish ${Math.round(p.maxAge)}d`:'good');
      predictions.push({fixture:{date,time:fx.time,league:league||null,home:r.home,away:r.away,provider:r.source||null,sourceStatus:fx.sourceStatus,competition:r.competition||null,competitionSlug:r.competitionSlug||null,sourceFixtureId:r.sourceFixtureId||null},coverage,coveragePack:isC1?'C1':null,tier,rawTier,quality:p.quality,probs:p.probs,pick:p.pickName,pickProb:p.pickProb,predictionMode:isC1?'L0 C1 TRANSFER':'L0 FALLBACK',fusionEligible:false,layerPredictions:{L0:p.probs},intelligenceStatus:null,scoreMarkets:null,resolution:{homeState:p.snap?{games:p.snap.homeGames,lastDate:p.snap.homeLastDate,league:p.snap.homeLeague}:null,awayState:p.snap?{games:p.snap.awayGames,lastDate:p.snap.awayLastDate,league:p.snap.awayLeague}:null}});
    }'''
          s=s[:loop_start]+new_loop+s[loop_end:]

          s=s.replace("crossLeagueLinks:targetState.crossLeagueLinks,excluded}","crossLeagueLinks:targetState.crossLeagueLinks,c1StateAudit:c1Audit,identityPolicy:{genderNamespaceSeparated:true,youthReserveNamespaceSeparated:true,uniqueSignatureResolver:true},excluded}")
          p.write_text(s)
          PY

      - name: Run repaired HBT shadow resolver
        run: node scripts/.hbt_resolver_v3_tmp.mjs --date 2026-09-18

      - name: Build immutable resolver-v3 candidate card
        run: |
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone
          root=pathlib.Path('hbt_live_data')
          data=json.load(open(root/'hbt_broad_shadow_forecast_2026-09-18_resolver_v3.json',encoding='utf-8'))
          captured=datetime.now(timezone.utc)
          rows=[]
          for r in data.get('predictions',[]):
              f=r['fixture']; h,d,a=map(float,r['probs']); q=float(r.get('quality') or 0)
              ko=datetime.fromisoformat(f"{f['date']}T{f.get('time','00:00')}:00+00:00")
              status='PRE_KICKOFF' if ko>captured else 'POST_KICKOFF'
              hd=h/(h+a) if h+a else None; ad=a/(h+a) if h+a else None
