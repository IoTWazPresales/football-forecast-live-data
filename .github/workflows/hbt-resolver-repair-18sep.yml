name: HBT 18 Sep Resolver Repair

on:
  push:
    branches:
      - research/hbt-1.4-match-intelligence
    paths:
      - '.github/workflows/hbt-resolver-repair-18sep.yml'
      - 'scripts/hbt_patch_resolver_v3.py'
      - 'scripts/hbt_build_resolver_v3_card.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolver-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/hbt-1.4-match-intelligence
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh 18 Sep discovery
        run: |
          set -euo pipefail
          python scripts/hbt_scan_slate_v2_1.py --date 2026-09-18
          python - <<'PY'
          import json
          s=json.load(open('hbt_live_data/slate_scanner.json',encoding='utf-8'))
          assert s.get('targetDate')=='2026-09-18'
          assert int((s.get('coverage') or {}).get('fixturesDiscovered') or 0)>0
          print(json.dumps({'generatedAt':s.get('generatedAt'),'coverage':s.get('coverage')},indent=2))
          PY

      - name: Build resolver-v3 shadow runner
        run: |
          set -euo pipefail
          python -m py_compile scripts/hbt_patch_resolver_v3.py scripts/hbt_build_resolver_v3_card.py
          python scripts/hbt_patch_resolver_v3.py
          sed -i "s/const FD={pl\.1:'POL',ie\.1:'IRL'}/const FD={'pl.1':'POL','ie.1':'IRL'}/" scripts/.hbt_resolver_v3_tmp.mjs
          node --check scripts/.hbt_resolver_v3_tmp.mjs

      - name: Run resolver-v3 HBT shadow forecast
        run: node scripts/.hbt_resolver_v3_tmp.mjs --date 2026-09-18

      - name: Build immutable resolver-v3 candidate card
        run: python scripts/hbt_build_resolver_v3_card.py

      - name: Remove temporary runner
        run: rm -f scripts/.hbt_resolver_v3_tmp.mjs

      - name: Commit resolver-v3 prospective capture
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hbt_live_data/slate_scanner.json hbt_live_data/hbt_broad_shadow_forecast_2026-09-18_resolver_v3.json hbt_live_data/hbt_broad_shadow_status_2026-09-18_resolver_v3.json hbt_live_data/hbt_18sep_resolver_v3_candidates.json
          git diff --staged --quiet && exit 0
          git commit -m 'test: freeze 18 Sep gender-safe resolver-v3 HBT card [skip ci]'
          git push origin HEAD:research/hbt-1.4-match-intelligence
