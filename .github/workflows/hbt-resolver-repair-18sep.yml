          out={'schemaVersion':'HBT-18SEP-RESOLVER-V3-CANDIDATES-1','capturedAt':captured.isoformat().replace('+00:00','Z'),'targetDate':'2026-09-18','origin':'HBT_SHADOW_RESOLVER_V3','policy':{'externalFootballObservationUsed':False,'bookmakerOddsUsedAsPredictiveFeature':False,'bookmakerPriceObservedBeforeCapture':False,'modelRetuned':False,'competitionLabelIsEligibilityGate':False,'genderNamespaceSeparated':True,'youthReserveNamespaceSeparated':True,'uniqueClubSignatureResolution':True,'c1UsesFrozenL0StructuralWeights':True,'c1ATierPromotionAllowed':False,'derivedMarketsAreExactAlgebraFromHDA':True,'postKickoffBackfillAllowed':False},'parityDiagnostic':data.get('bridge',{}).get('goldenMaxAbsError'),'c1StateAudit':data.get('bridge',{}).get('c1StateAudit'),'candidates':rows,'counts':{'predictions':len(rows),'preKickoff':sum(x['statusAtCapture']=='PRE_KICKOFF' for x in rows),'postKickoff':sum(x['statusAtCapture']=='POST_KICKOFF' for x in rows),'c1':sum(x.get('coveragePack')=='C1' for x in rows)}}
          json.dump(out,open(root/'hbt_18sep_resolver_v3_candidates.json','w',encoding='utf-8'),indent=2)
