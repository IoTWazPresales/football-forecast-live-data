name: HBT Frozen Bridge Guard Check

on:
  push:
    branches:
      - research/hbt-1.4-match-intelligence
    paths:
      - .github/workflows/hbt-frozen-bridge-guard-check.yml
      - scripts/hbt_frozen_forecast_bridge.mjs
      - runtime/hbt_frozen_runtime_bundle.json

permissions:
  contents: read

jobs:
  guard-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/hbt-1.4-match-intelligence
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run guarded frozen bridge
        run: |
          node scripts/hbt_frozen_forecast_bridge.mjs --date 2026-09-17
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('hbt_live_data/forecast_bridge_status.json','utf8')); if(s.status!=='READY') { console.error(s); process.exit(1); } if(!s.goldenParity?.pass || s.goldenParity?.unresolved!==0 || s.goldenParity?.maxAbsError>1e-9) { console.error('golden parity guard failed',s.goldenParity); process.exit(1); } if(s.goldenParity?.tolerance!==1e-9) { console.error('parity tolerance changed',s.goldenParity?.tolerance); process.exit(1); } if(!s.policy?.frozenWeightsHydrated || s.policy?.retrainingOrRetuningPerformed || s.policy?.modelChoiceSearchPerformed) { console.error('frozen-model guard failed',s.policy); process.exit(1); } if(s.runtimeModel?.source!=='exact HBT-0.4a frozen snapshot') { console.error('unexpected runtime source',s.runtimeModel); process.exit(1); } console.log(JSON.stringify({status:s.status,source:s.runtimeModel?.source,parity:s.goldenParity,policy:s.policy},null,2));"
