name: HBT 18 Sep Broad Shadow Card

on:
  push:
    branches:
      - research/hbt-1.4-match-intelligence
    paths:
      - '.github/workflows/hbt-broad-shadow-card-18sep.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  broad-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/hbt-1.4-match-intelligence
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build broad reconstructed HBT shadow runner
        run: |
          set -euo pipefail
          git show 3742f927407114567a93424ac405735bdbc5b7ab:scripts/hbt_frozen_forecast_bridge.mjs > scripts/.hbt_broad_shadow_tmp.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/.hbt_broad_shadow_tmp.mjs')
          s=p.read_text()
          start=s.index('    if(!pass){')
          end=s.index('\n\n    const targetLoad=', start)
          s=s[:start]+"    if(!pass){console.warn('HBT BROAD SHADOW ONLY: reconstructed runtime failed frozen parity; proceeding as prospective test challenger. maxErr=',maxErr);}"+s[end:]
          s=s.replace("const STATUS = path.join(DATA, 'forecast_bridge_status.json');","const STATUS = path.join(DATA, 'hbt_broad_shadow_status_2026-09-18.json');")
          s=s.replace("const VERSION = 'HBT-FROZEN-FORECAST-BRIDGE-1.2-EXACT-WEIGHTS';","const VERSION = 'HBT-BROAD-SHADOW-18SEP-1';")
          s=s.replace("`frozen_control_forecast_${targetDate}.json`","`hbt_broad_shadow_forecast_${targetDate}.json`")
          s=s.replace("schemaVersion:'HBT-FROZEN-CONTROL-FORECAST-1'","schemaVersion:'HBT-BROAD-SHADOW-FORECAST-1'")
          s=s.replace("sourceFile:'persisted HBT-1.1.2 exact frozen-weight runtime'","sourceFile:'reconstructed HBT L0 broad-slate shadow test'")
          s=s.replace("sourceLabVersion:'HBT-1.1.2L-R1'","sourceLabVersion:'HBT-BROAD-SHADOW-18SEP-1'")
          s=s.replace("sourceEngineVersion:'HBT-0.4a frozen L0 exact-weight deployment bridge'","sourceEngineVersion:'HBT reconstructed L0 broad-slate shadow challenger'")
          s=s.replace("scope:'Date-scoped forecasts emitted only after exact persisted-weight golden parity.'","scope:'Prospective broad-slate shadow test. Competition label is not an eligibility gate; team-state resolution and HBT confidence remain the gates.'")
          s=s.replace("goldenParityRequired:true,goldenParityTolerance:PARITY_TOLERANCE","goldenParityRequired:false,goldenParityDiagnosticTolerance:PARITY_TOLERANCE")
          s=s.replace("goldenParityRequired:true,failClosed:true","goldenParityRequired:false,failClosed:false")
          s=s.replace("status:'READY'","status:'SHADOW_READY'")
          old="const league=fixtureLeague(r,intelLeague);if(!league||!codes.includes(league))continue;const fx={date,time:String(r.kickoff||'').slice(11,16),league,home:r.home,away:r.away,sourceStatus:(r.sourceFreshness?'loaded':'unknown')}"
          new="const league=fixtureLeague(r,intelLeague);const fx={date,time:String(r.kickoff||'').slice(11,16),league:league||'UNMAPPED',home:r.home,away:r.away,sourceStatus:(r.sourceFreshness?'loaded':'unknown')}"
          if old not in s:
              raise SystemExit('broad-loop patch anchor not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY

      - name: Run HBT broad shadow forecast
        run: node scripts/.hbt_broad_shadow_tmp.mjs --date 2026-09-18

      - name: Build immutable HBT candidate card
        run: |
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone
          root=pathlib.Path('hbt_live_data')
          src=root/'hbt_broad_shadow_forecast_2026-09-18.json'
          data=json.load(open(src,encoding='utf-8'))
          captured=datetime.now(timezone.utc)
          rows=[]
          for r in data.get('predictions',[]):
              f=r['fixture']; h,d,a=map(float,r['probs']); tier=r.get('tier') or 'Avoid'; q=float(r.get('quality') or 0)
              ko=datetime.fromisoformat(f"{f['date']}T{f.get('time','00:00')}:00+00:00")
              status='PRE_KICKOFF' if ko>captured else 'POST_KICKOFF'
              home_dnb=h/(h+a) if h+a else None
              away_dnb=a/(h+a) if h+a else None
              rows.append({
                'fixture':f,'statusAtCapture':status,'origin':'HBT_SHADOW_BROAD','tier':tier,'quality':q,
                'probs':{'H':h,'D':d,'A':a},
                'derivedMarkets':{
                  'HOME_WIN':{'p':h,'fairOdds':1/h if h else None},
                  'DRAW':{'p':d,'fairOdds':1/d if d else None},
                  'AWAY_WIN':{'p':a,'fairOdds':1/a if a else None},
                  '1X':{'p':h+d,'fairOdds':1/(h+d) if h+d else None},
                  'X2':{'p':a+d,'fairOdds':1/(a+d) if a+d else None},
                  '12':{'p':h+a,'fairOdds':1/(h+a) if h+a else None},
                  'HOME_DNB':{'conditionalP':home_dnb,'winP':h,'pushP':d,'lossP':a,'fairOdds':(h+a)/h if h else None},
                  'AWAY_DNB':{'conditionalP':away_dnb,'winP':a,'pushP':d,'lossP':h,'fairOdds':(h+a)/a if a else None}
                }
              })
          out={
            'schemaVersion':'HBT-18SEP-PROSPECTIVE-CANDIDATES-1',
            'capturedAt':captured.isoformat().replace('+00:00','Z'),
            'targetDate':'2026-09-18','origin':'HBT_SHADOW_BROAD',
            'policy':{
              'externalFootballObservationUsed':False,
              'bookmakerOddsUsedAsPredictiveFeature':False,
              'bookmakerPriceObservedBeforeCapture':False,
              'modelRetuned':False,
              'competitionLabelIsEligibilityGate':False,
              'teamStateResolutionRequired':True,
              'derivedMarketsAreExactAlgebraFromHDA':True,
              'postKickoffBackfillAllowed':False
            },
            'parityDiagnostic':data.get('bridge',{}).get('goldenMaxAbsError'),
            'candidates':rows,
            'counts':{'predictions':len(rows),'preKickoff':sum(x['statusAtCapture']=='PRE_KICKOFF' for x in rows),'postKickoff':sum(x['statusAtCapture']=='POST_KICKOFF' for x in rows)}
          }
          json.dump(out,open(root/'hbt_18sep_prospective_candidates.json','w',encoding='utf-8'),indent=2)
          print(json.dumps(out,indent=2))
          PY

      - name: Remove temporary runner
        run: rm -f scripts/.hbt_broad_shadow_tmp.mjs

      - name: Commit prospective capture
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hbt_live_data/hbt_broad_shadow_forecast_2026-09-18.json hbt_live_data/hbt_broad_shadow_status_2026-09-18.json hbt_live_data/hbt_18sep_prospective_candidates.json
          git diff --staged --quiet && exit 0
          git commit -m 'test: freeze 18 Sep HBT prospective candidate card [skip ci]'
          git push origin HEAD:research/hbt-1.4-match-intelligence
