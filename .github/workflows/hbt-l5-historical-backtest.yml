name: HBT L5 Historical Value Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - research/hbt-l5-bet-backtest
    paths:
      - 'research/l5/**'
      - 'scripts/hbt_l5_*.py'
      - '.github/workflows/hbt-l5-historical-backtest.yml'

permissions:
  contents: read

jobs:
  historical-value-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m py_compile scripts/hbt_l5_historical_value_backtest.py scripts/hbt_l5_market_signal_audit.py scripts/hbt_l5_big5_value_audit.py

      - name: Run isolated EPL L5 value backtest
        run: |
          mkdir -p research/l5/output
          python scripts/hbt_l5_historical_value_backtest.py | tee research/l5/output/run-summary.txt

      - name: Run EPL chronological market-signal audit
        run: python scripts/hbt_l5_market_signal_audit.py | tee research/l5/output/market-signal-summary.txt

      - name: Run Big-Five value audit
        run: python scripts/hbt_l5_big5_value_audit.py | tee research/l5/output/big5-summary.txt

      - name: Assert research boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/l5/output/hbt_l5_epl_2018_19_final_backtest.json')
          d=json.loads(p.read_text())
          assert d['researchOnly'] is True
          assert d['footballModelModified'] is False
          assert d['protocol']['oddsFeedBackIntoProbability'] is False
          assert d['protocol']['accumulators'] is False
          assert d['cohort']['joinedRows'] == d['cohort']['frozenRows']
          assert not d['joinAudit']['missing']
          assert not d['joinAudit']['outcomeMismatches']
          q=json.loads(Path('research/l5/output/hbt_l5_epl_market_signal_audit.json').read_text())
          assert q['researchOnly'] is True
          assert q['footballModelModified'] is False
          assert q['oddsFeedBackIntoProbability'] is False
          assert q['cohort']['joined'] == 206
          assert q['cohort']['final'] == 56
          b=json.loads(Path('research/l5/output/hbt_l5_big5_2018_19_value_audit.json').read_text())
          assert b['researchOnly'] is True
          assert b['footballModelModified'] is False
          assert b['oddsFeedBackIntoProbability'] is False
          assert b['coverage']['joined'] == b['coverage']['baseline'] == 1232
          assert b['protocol']['accumulators'] is False
          print('L5 EPL + Big-Five boundary, join, and chronology invariants passed.')
          PY

      - name: Upload L5 research result
        uses: actions/upload-artifact@v4
        with:
          name: hbt-l5-2018-19-value-backtests
          path: |
            research/l5/output/hbt_l5_epl_2018_19_final_backtest.json
            research/l5/output/hbt_l5_epl_market_signal_audit.json
            research/l5/output/hbt_l5_big5_2018_19_value_audit.json
            research/l5/output/run-summary.txt
            research/l5/output/market-signal-summary.txt
            research/l5/output/big5-summary.txt
          if-no-files-found: error
