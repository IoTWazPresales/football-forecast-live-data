name: HBT Slate Scanner Validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/hbt-1.4-match-intelligence
    paths:
      - 'scripts/hbt_scan_slate_v2.py'
      - 'scripts/hbt_scan_slate_v2_1.py'
      - 'scripts/hbt_rank_slate.py'
      - 'hbt_live_data/frozen_control_forecast_*.json'
      - 'hbt_live_data/live_experiments.json'
      - '.github/workflows/hbt-slate-scanner-ci.yml'

permissions:
  contents: read

jobs:
  validate-slate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/hbt-1.4-match-intelligence
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile scanner and ranker
        run: python -m py_compile scripts/hbt_scan_slate_v2.py scripts/hbt_scan_slate_v2_1.py scripts/hbt_rank_slate.py
      - name: Run SAST slate scanner
        run: |
          TARGET_DATE="$(TZ=Africa/Johannesburg date +%F)"
          python scripts/hbt_scan_slate_v2_1.py --date "$TARGET_DATE"
      - name: Validate scanner contract
        run: |
          python - <<'PY'
          import json
          s=json.load(open('hbt_live_data/slate_scanner.json',encoding='utf-8'))
          assert s['schemaVersion']=='HBT-SLATE-2'
          p=s['policy']
          assert p['discoveryBeforeRanking'] is True
          assert p['bookmakerOddsUsed'] is False
          assert p['frozenPredictiveModelMutated'] is False
          assert p['retrainingPerformed'] is False
          assert p['fallbackFabricated'] is False
          assert p['testAImmutable'] is True
          allowed={'FULL_MODEL','FALLBACK','INSUFFICIENT_DATA','UNSUPPORTED_COMPETITION','SOURCE_FAILURE','NOT_YET_READY'}
          for r in s['fixtures']:
              assert r['hbtSupportLevel'] in allowed
              if r.get('probabilityOutput') is not None:
                  assert r['hbtSupportLevel'] in {'FULL_MODEL','FALLBACK'}
                  assert len(r['probabilityOutput'])==3
              if r.get('rankEligibleFullModel'):
                  assert r['hbtSupportLevel']=='FULL_MODEL' and 'FUSION' in r['predictionMode']
              if r.get('rankEligibleFallback'):
                  assert r['hbtSupportLevel']=='FALLBACK' and r['predictionMode'].startswith('L0')
          a=s.get('frozenForecastAdapter') or {}
          if a.get('available'):
              assert a.get('generalFutureLiveFeed') is False
              c=s.get('coverage') or {}; g=s.get('rankingGate') or {}
              assert int(c.get('forecastRowsAvailable') or 0) > 0
              assert int(c.get('knownForecastsMissedByDiscovery') or 0) == 0, c
              assert int(c.get('forecastRowsMatched') or 0) == int(c.get('forecastRowsAvailable') or 0), c
              assert g.get('knownForecastCoverageComplete') is True, g
              assert g.get('discoveryComplete') is True, g
          print(json.dumps({'version':s['version'],'coverage':s['coverage'],'rankingGate':s['rankingGate']},indent=2))
          PY
      - name: Rank only after discovery gate
        run: python scripts/hbt_rank_slate.py
      - name: Validate ranking separation and frozen Test A
        run: |
          python - <<'PY'
          import json
          r=json.load(open('hbt_live_data/ranked_candidates.json',encoding='utf-8'))
          assert r['status']=='RANKING_READY', r.get('status')
          assert r['policy']['fullModelAndFallbackSeparated'] is True
          assert r['policy']['rawProbabilityIsNotBettingValue'] is True
          assert r['policy']['universalBestBetsClaimAllowed'] is False
          assert r['policy']['testAImmutable'] is True
          z=r['rankings']
          assert all(x['support']=='FULL_MODEL' for x in z['strongestFullModelConfidence'])
          assert all(x['support']=='FALLBACK' for x in z['fallbackOnly'])
          assert z['experimentalValueVsPrice']['status']=='UNAVAILABLE_NO_BOOKMAKER_PRICE'
          t=r['testAReference']
          assert t['id']=='PRE_XI_TEST_A_2026-09-15' and t['state']=='FROZEN_PROSPECTIVE'
          assert len(t['legs'])==3 and float(t['stakeZAR'])==1.0
          print(json.dumps({
            'rawTop':[(x['pick'],x['pickProbability'],x['support']) for x in z['highestRawDeployedPickProbability'][:5]],
            'fullModel':[(x['pick'],x['pickProbability'],x['tier']) for x in z['strongestFullModelConfidence']],
            'fallback':[(x['pick'],x['pickProbability'],x['tier']) for x in z['fallbackOnly']],
            'ignored':z['unsupportedOrIgnored']
          },indent=2,ensure_ascii=False))
          PY
