name: HBT Forensic Learning

on:
  push:
    branches:
      - research/hbt-1.4-match-intelligence
    paths:
      - '.github/workflows/hbt-forensic-learning.yml'
      - 'scripts/hbt_forensic_learning_v3.py'
      - 'scripts/hbt_rebuild_learning_registry_v2.py'
      - 'scripts/hbt_learning_assessment_v1.py'
      - 'scripts/hbt_learning_assessment_v2.py'
      - 'hbt_live_data/hbt_betway_execution_*.json'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD settled slate date'
        required: true
        type: string
  schedule:
    - cron: '15 4 * * *'

permissions:
  contents: write

concurrency:
  group: hbt-research-output-writer
  cancel-in-progress: false

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/hbt-1.4-match-intelligence
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile scripts/hbt_forensic_learning_v1.py scripts/hbt_forensic_learning_v2.py scripts/hbt_forensic_learning_v3.py scripts/hbt_rebuild_learning_registry_v2.py scripts/hbt_learning_assessment_v1.py scripts/hbt_learning_assessment_v2.py
          python scripts/hbt_forensic_learning_v2.py --self-test
          python scripts/hbt_forensic_learning_v3.py --self-test

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET='${{ inputs.date }}'
          else
            TARGET="$(TZ=Africa/Johannesburg date -d yesterday +%F)"
            if [[ ! -f "hbt_live_data/hbt_prospective_card_${TARGET}.json" ]]; then
              echo 'No immutable prospective HBT card for the previous completed day' >&2
              exit 1
            fi
          fi
          echo "date=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Forensic target: $TARGET"

      - name: Run competition-safe guard-aware forensic audit
        run: |
          set -euo pipefail
          python scripts/hbt_forensic_learning_v3.py --date '${{ steps.target.outputs.date }}'
          python scripts/hbt_rebuild_learning_registry_v2.py
          python scripts/hbt_learning_assessment_v2.py

      - name: Guard learning policy and output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          d=os.environ['TARGET_DATE']
          p=f'hbt_live_data/forensic/hbt_forensic_{d}.json'
          x=json.load(open(p,encoding='utf-8'))
          pol=x['policy']
          assert pol['preMatchForecastImmutable'] is True
          assert pol['postMatchEvidenceMayNotRewriteCapture'] is True
          assert pol['executionGuardBlockedRowsExcludedFromPredictiveLearning'] is True
          assert pol['unsupportedCompetitionRowsExcludedFromPredictiveLearning'] is True
          assert pol['unsupportedCompetitionsMayNotBeTreatedAsHBT'] is True
          assert pol['exactR0MarketSettlementEnabled'] is True
          assert pol['automaticModelMutation'] is False
          assert pol['automaticFeaturePromotion'] is False
          assert pol['preserveExistingIntelligence'] is True
          h=json.load(open('hbt_live_data/forensic/hbt_learning_hypotheses_v2.json',encoding='utf-8'))
          assert h['policy']['idempotentUniqueEvidenceCounting'] is True
          assert h['policy']['executionGuardBlockedRowsExcluded'] is True
          assert h['policy']['automaticModelMutation'] is False
          assert h['policy']['automaticFeaturePromotion'] is False
          a=json.load(open('hbt_live_data/forensic/hbt_learning_assessment_v1.json',encoding='utf-8'))
          assert a['policy']['predictiveModelMutated'] is False
          assert a['policy']['weightsRetuned'] is False
          assert a['policy']['cleanEvidenceRequiredForPromotion'] is True
          print(json.dumps(x['summary'],indent=2))
          print(json.dumps(h['coverage'],indent=2))
          print(json.dumps({'assessmentVersion':a.get('version'),'scope':a.get('scope'),'evidenceQuality':a.get('evidenceQuality')},indent=2))
          PY
        env:
          TARGET_DATE: '${{ steps.target.outputs.date }}'

      - name: Commit forensic evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hbt_live_data/forensic/
          python scripts/hbt_publish_research_outputs.py --message "forensic: competition-safe guard-aware audit HBT settled slate ${{ steps.target.outputs.date }} [skip ci]"
