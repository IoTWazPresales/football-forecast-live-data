name: HBT Patch Frozen Snapshot Guard

on:
  push:
    branches:
      - research/hbt-1.4-match-intelligence
    paths:
      - .github/workflows/hbt-patch-frozen-snapshot-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/hbt-1.4-match-intelligence
          fetch-depth: 1

      - name: Replace invalid Fusion-era L0 substitution with fail-closed snapshot guard
        shell: python
        run: |
          from pathlib import Path

          p = Path('scripts/hbt_frozen_forecast_bridge.mjs')
          s = p.read_text(encoding='utf-8')

          old_version = "const VERSION = 'HBT-FROZEN-FORECAST-BRIDGE-1.2-EXACT-WEIGHTS';"
          new_version = "const VERSION = 'HBT-FROZEN-FORECAST-BRIDGE-1.3-FROZEN-SNAPSHOT-GUARD';"
          if old_version not in s:
              raise SystemExit('Expected bridge version not found; refusing blind patch')
          s = s.replace(old_version, new_version, 1)

          old = """    const lock=bundle.liveL0Reference?.modelChoiceLock,l1=bundle.deploymentSnapshot?.models?.l1,l0Spec=l1?.baseModel;if(!lock?.opts||!l0Spec?.baseModel)throw new Error('persisted frozen L0 model missing');
    const model=hydrateFrozenModel(l0Spec),baseModel=model.baseModel,T=Number(lock.T);
    if(!Number.isFinite(T))throw new Error('frozen L0 temperature missing');
"""
          new = """    const lock=bundle.liveL0Reference?.modelChoiceLock;
    if(!lock?.opts)throw new Error('frozen L0 model-choice lock missing');
    const frozenSnapshot=bundle.frozenL0Snapshot||bundle.liveL0Snapshot||null;
    const requiredCreated=String(bundle.liveL0Reference?.snapshotCreated||'');
    const snapshotComplete=!!(frozenSnapshot&&frozenSnapshot.engine==='HBT-0.4a'&&Array.isArray(frozenSnapshot.states)&&Array.isArray(frozenSnapshot.leagues)&&Array.isArray(frozenSnapshot.aliases)&&frozenSnapshot.baseModel&&frozenSnapshot.model);
    if(!snapshotComplete){
      writeJSON(STATUS,{...statusBase,status:'BLOCKED_FROZEN_L0_SNAPSHOT_MISSING',requiredSnapshot:{engine:'HBT-0.4a',schema:2,created:requiredCreated||null,requiredFields:['baseModel','model','states','leagues','aliases','opts','T','modelChoiceLock']},invalidSubstituteRejected:'deploymentSnapshot.models.l1.baseModel',reason:'The runtime bundle does not contain the exact persisted HBT-0.4a deployment snapshot. A later Fusion/L1 nested baseModel is not the frozen live L0 runtime and must not be used as a substitute.',runtimeMs:performance.now()-started});
      console.error('HBT frozen bridge blocked: exact HBT-0.4a deployment snapshot missing',requiredCreated||'(timestamp unavailable)');
      return 2;
    }
    if(requiredCreated&&String(frozenSnapshot.created||'')!==requiredCreated)throw new Error(`frozen L0 snapshot timestamp mismatch: expected ${requiredCreated}, got ${String(frozenSnapshot.created||'missing')}`);
    throw new Error('Exact HBT-0.4a snapshot recovered but direct snapshot-state hydration is not yet implemented; fail closed rather than reconstruct or re-fit.');
"""
          if old not in s:
              raise SystemExit('Expected invalid model-selection block not found; refusing blind patch')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify safety invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "BLOCKED_FROZEN_L0_SNAPSHOT_MISSING" scripts/hbt_frozen_forecast_bridge.mjs
          grep -F "invalidSubstituteRejected:'deploymentSnapshot.models.l1.baseModel'" scripts/hbt_frozen_forecast_bridge.mjs
          grep -F "const PARITY_TOLERANCE = 1e-9;" scripts/hbt_frozen_forecast_bridge.mjs
          if grep -F "const lock=bundle.liveL0Reference?.modelChoiceLock,l1=bundle.deploymentSnapshot?.models?.l1,l0Spec=l1?.baseModel" scripts/hbt_frozen_forecast_bridge.mjs; then
            echo 'Invalid Fusion-era substitution remains' >&2
            exit 1
          fi

      - name: Commit guarded bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/hbt_frozen_forecast_bridge.mjs
          git diff --staged --quiet && exit 0
          git commit -m 'bridge: fail closed without exact HBT-0.4a frozen snapshot'
          git push origin HEAD:research/hbt-1.4-match-intelligence
