name: HBT Frozen Parity Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - research/hbt-1.4-match-intelligence
      - research/hbt-1.4-match-intelligence-snapshot-fix
    paths:
      - .github/workflows/hbt-frozen-parity-diagnostic.yml
      - scripts/hbt_snapshot_chunk_probe.mjs
      - scripts/hbt_frozen_forecast_bridge.mjs
      - runtime/hbt_frozen_l0_snapshot_*
      - runtime/hbt_frozen_runtime_bundle.json

permissions:
  contents: read

jobs:
  frozen-parity-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe persisted frozen snapshot chunks
        shell: bash
        run: |
          node scripts/hbt_snapshot_chunk_probe.mjs

      - name: Run exact frozen bridge loader
        shell: bash
        run: |
          set +e
          node scripts/hbt_frozen_forecast_bridge.mjs --date 2026-09-17
          code=$?
          echo "bridge_exit=$code" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Summarize bridge state
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('hbt_live_data/forecast_bridge_status.json')
          if not p.exists():
              out = {'schemaVersion':'HBT-FROZEN-PARITY-DIAGNOSTIC-2','status':'NO_STATUS'}
          else:
              d=json.loads(p.read_text(encoding='utf-8'))
              gp=d.get('goldenParity') or {}
              out={
                  'schemaVersion':'HBT-FROZEN-PARITY-DIAGNOSTIC-2',
                  'status':d.get('status'),
                  'reason':d.get('reason'),
                  'parityTolerance':d.get('parityTolerance') or gp.get('tolerance'),
                  'maxAbsError':gp.get('maxAbsError'),
                  'unresolved':gp.get('unresolved'),
                  'requiredSnapshot':d.get('requiredSnapshot'),
                  'policy':d.get('policy'),
              }
          Path('hbt_live_data/frozen_parity_cutoff_diagnostic.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2))

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hbt-frozen-parity-diagnostic
          path: |
            hbt_live_data/frozen_snapshot_chunk_probe.json
            hbt_live_data/frozen_parity_cutoff_diagnostic.json
            hbt_live_data/forecast_bridge_status.json
          if-no-files-found: warn
