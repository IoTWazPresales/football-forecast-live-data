name: HBT Understat Transport Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hbt-understat-transport-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/hbt-1.4-match-intelligence
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run non-predictive transport probe
        run: python scripts/hbt_probe_understat_transport_v1.py
      - name: Prove HBT intelligence is untouched by probe
        run: |
          git diff --exit-code -- hbt_live_data/hbt_1_4_match_intelligence.json hbt_live_data/hbt_1_4_feature_registry.json
      - name: Commit probe diagnostics only
        run: |
          set -euo pipefail
          BRANCH='research/hbt-1.4-match-intelligence'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hbt_live_data/understat_transport_probe.json
          git diff --staged --quiet && exit 0
          git commit -m 'diagnostic: record Understat transport probe [skip ci]'
          git push origin "HEAD:$BRANCH"
